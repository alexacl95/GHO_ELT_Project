name: CI-CD Pipeline

on:
  push:
    branches:
      - main
      - 'feature/*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cancel an older run of the same branch when a new commit arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # 1. Fast checks: no Docker, no secrets. Fails in seconds on typos
  #    and undefined names.
  # ---------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  # ---------------------------------------------------------------
  # 2. Decide which expensive jobs are needed.
  # ---------------------------------------------------------------
  changes:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Get changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            image:
              - 'dockerfile'
              - 'Dockerfile'
              - 'requirements.txt'
            code:
              - 'dags/**'
              - 'src/**'
              - 'sql/**'
              - 'include/**'
              - 'tests/**'
              - 'docker-compose.yaml'
              - 'requirements.txt'
              - 'dockerfile'
              - 'Dockerfile'

  # ---------------------------------------------------------------
  # 3. Build the Airflow image (Java + PySpark included) and push it.
  #    Never pushes from pull requests.
  # ---------------------------------------------------------------
  build-and-push-image:
    runs-on: ubuntu-latest
    needs: [lint, changes]
    if: needs.changes.outputs.image == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Validate required vars
        run: |
          if [ -z "${{ vars.DOCKERHUB_NAMESPACE }}" ]; then
            echo "ERROR: DOCKERHUB_NAMESPACE not set in GitHub repository variables"
            exit 1
          fi
          if [ -z "${{ vars.DOCKERHUB_REPOSITORY }}" ]; then
            echo "ERROR: DOCKERHUB_REPOSITORY not set in GitHub repository variables"
            exit 1
          fi
          echo "✓ DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}"
          echo "✓ DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}"
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      
      - name: Build and push
        run: |
          PUSH_FLAG=""
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            PUSH_FLAG="--push"
          else
            PUSH_FLAG="--load"
          fi
          
          docker buildx build $PUSH_FLAG \
            --file ./dockerfile \
            --tag ${{ vars.DOCKERHUB_NAMESPACE }}/${{ vars.DOCKERHUB_REPOSITORY }}:latest \
            --tag ${{ vars.DOCKERHUB_NAMESPACE }}/${{ vars.DOCKERHUB_REPOSITORY }}:${{ github.sha }} \
            .

